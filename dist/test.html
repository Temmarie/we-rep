<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Core Skills & Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <div class="bg-white py-20 px-4">
    <div class="max-w-3xl mx-auto text-center relative">
      <!-- Stylish Quotation Mark -->
      <div
        class="text-6xl text-yellow-400 font-serif absolute top-0 left-1 transform -translate-x-6 -translate-y-3 opacity-30 select-none"
      >
        &ldquo;
      </div>

      <!-- Quote Text -->
      <blockquote
        class="text-2xl md:text-3xl font-medium text-gray-800 leading-relaxed"
      >
        “The secret of getting ahead is getting started.”
      </blockquote>

      <!-- Author -->
      <footer
        class="mt-6 text-sm text-gray-500 font-semibold tracking-wide uppercase"
      >
        — Mark Twain
      </footer>
    </div>
  </div>

  <section
    class="bg-cover bg-center bg-no-repeat"
    style="background-image: url('https://via.placeholder.com/1500x900')"
  >
    <div class="flex min-h-screen bg-black/40 text-white">
      <!-- Left Section -->
      <div class="w-1/2 p-16 flex flex-col justify-center">
        <p class="text-lg">Top team skills</p>
        <h1 class="text-5xl font-light mb-8">Core skills</h1>
        <div class="w-3/4 h-1 bg-white mb-10"></div>

        <!-- Metal Roofing -->
        <div class="mb-6">
          <p class="text-lg">Metal roofing</p>
          <div class="relative w-full h-1 bg-white/50 mt-2">
            <div
              class="absolute top-0 left-0 h-1 bg-yellow-500"
              style="width: 90%"
            ></div>
          </div>
          <div class="mt-1">
            <span class="bg-black px-2 py-1 text-sm">90 %</span>
          </div>
        </div>

        <!-- Financial Consulting -->
        <div class="mb-6">
          <p class="text-lg">Financial consulting</p>
          <div class="relative w-full h-1 bg-white/50 mt-2">
            <div
              class="absolute top-0 left-0 h-1 bg-yellow-500"
              style="width: 75%"
            ></div>
          </div>
          <div class="mt-1">
            <span class="bg-black px-2 py-1 text-sm">75 %</span>
          </div>
        </div>

        <!-- Outdoor Gardens -->
        <div class="mb-6">
          <p class="text-lg">Outdoor gardens</p>
          <div class="relative w-full h-1 bg-white/50 mt-2">
            <div
              class="absolute top-0 left-0 h-1 bg-yellow-500"
              style="width: 100%"
            ></div>
          </div>
          <div class="mt-1">
            <span class="bg-black px-2 py-1 text-sm">100 %</span>
          </div>
        </div>

        <a href="#" class="mt-4 text-white underline decoration-yellow-500"
          >Check all out skills</a
        >
      </div>

      <!-- Right Section -->
      <div class="w-1/2 bg-yellow-500 p-16 flex flex-col justify-center">
        <!-- Address -->
        <div class="text-white mb-6">
          <div class="flex items-center mb-2">
            <i class="fas fa-location-dot mr-3"></i>
            <p>184 Main Collins Street, 8007</p>
          </div>
          <div class="flex items-center">
            <i class="fas fa-calendar-days mr-3"></i>
            <p>Mon - Sat 8.00 - 18.00</p>
          </div>
        </div>

        <h2 class="text-4xl font-light text-white mb-8">Contact us now</h2>

        <!-- Contact Form -->
        <form class="space-y-6">
          <div class="flex space-x-4">
            <input
              type="text"
              placeholder="name"
              class="flex-1 bg-transparent border-b border-white placeholder-white focus:outline-none"
            />
            <input
              type="email"
              placeholder="email"
              class="flex-1 bg-transparent border-b border-white placeholder-white focus:outline-none"
            />
          </div>
          <textarea
            rows="3"
            placeholder="Write your message"
            class="w-full bg-transparent border-b border-white placeholder-white focus:outline-none"
          ></textarea>

          <button
            class="flex items-center bg-white text-gray-800 px-4 py-2 rounded shadow mt-4"
          >
            <i class="fas fa-envelope mr-2"></i> Send message
          </button>
        </form>
      </div>
    </div>
  </section>
</html>
