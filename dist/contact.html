<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | WeRep</title>
    <link rel="stylesheet" href="assets/css/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
    />
    <script src="https://unpkg.com/alpinejs" defer></script>
  </head>

  <body class="bg-white text-gray-900 font-sans">
    <!-- Top Bar -->

    <!-- Header -->
    <header
      x-data="{
    mobileOpen: false,
    lastScrollY: window.scrollY,
    hidden: false,
    handleScroll() {
      if (window.scrollY > this.lastScrollY && window.scrollY > 50) {
        this.hidden = true;
      } else {
        this.hidden = false;
      }
      this.lastScrollY = window.scrollY;
    }
  }"
      x-init="window.addEventListener('scroll', () => handleScroll())"
      :class="hidden ? '-translate-y-full opacity-0' : 'translate-y-0 opacity-100'"
      class="bg-white shadow-md sticky top-0 z-50 transition-transform duration-300 ease-in-out transform"
    >
      <div class="bg-yellow-400 p-1"></div>
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="text-3xl font-bold text-black">WeRep</div>
        <nav
          class="hidden md:flex space-x-6 text-sm uppercase font-semibold tracking-wide"
        >
          <a href="index.html" class="text-yellow-500">Home</a>
          <a href="services.html" class="hover:text-yellow-500">Services</a>
          <a href="about.html" class="hover:text-yellow-500">About</a>
          <a href="contact.html" class="hover:text-yellow-500">Contact</a>
        </nav>
        <button @click="mobileOpen = !mobileOpen" class="md:hidden">
          <i
            :class="mobileOpen ? 'fas fa-times' : 'fas fa-bars'"
            class="text-xl"
          ></i>
        </button>
      </div>

      <div
        x-show="mobileOpen"
        x-transition
        class="md:hidden bg-white border-t border-gray-200"
      >
        <nav
          class="flex flex-col px-4 py-4 space-y-2 text-sm uppercase font-semibold"
        >
          <a href="index.html" class="text-yellow-500">Home</a>
          <a href="services.html">Services</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <!-- Contact Section -->
    <section class="py-16 bg-gray-50">
      <div class="max-w-6xl mx-auto px-4">
        <h2 class="text-4xl font-bold text-center mb-10">Get in Touch</h2>
        <div class="grid md:grid-cols-2 gap-10">
          <!-- Contact Info -->
          <div class="space-y-6">
            <div>
              <h3 class="text-xl font-semibold mb-2">Email</h3>
              <p class="text-gray-700 flex items-center">
                <i class="fas fa-envelope text-yellow-500 mr-2"></i>
                contact@werep.co.uk
              </p>
            </div>
            <div>
              <h3 class="text-xl font-semibold mb-2">Phone</h3>
              <p class="text-gray-700 flex items-center">
                <i class="fas fa-phone text-yellow-500 mr-2"></i>
                +44 123 456 789
              </p>
            </div>
            <div>
              <h3 class="text-xl font-semibold mb-2">Address</h3>
              <p class="text-gray-700 flex items-center">
                <i class="fas fa-map-marker-alt text-yellow-500 mr-2"></i>
                123 London Street, London, UK
              </p>
            </div>
            <div class="space-x-4 text-xl mt-6">
              <a href="#" class="text-gray-600 hover:text-yellow-500"
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a href="#" class="text-gray-600 hover:text-yellow-500"
                ><i class="fab fa-twitter"></i
              ></a>
              <a href="#" class="text-gray-600 hover:text-yellow-500"
                ><i class="fab fa-linkedin-in"></i
              ></a>
            </div>
          </div>

          <!-- Contact Form -->
          <form class="space-y-4 bg-white p-6 rounded-lg shadow">
            <div>
              <label class="block mb-1 text-sm font-medium">Your Name</label>
              <input
                type="text"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium">Email</label>
              <input
                type="email"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              />
            </div>
            <div>
              <label class="block mb-1 text-sm font-medium">Message</label>
              <textarea
                rows="4"
                class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-yellow-400"
                required
              ></textarea>
            </div>
            <button
              type="submit"
              class="bg-yellow-400 hover:bg-yellow-500 text-black px-6 py-2 font-semibold rounded transition"
            >
              Send Message
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- Optional Map -->

    <section class="h-96">
      <iframe
        class="w-full h-full"
        src="https://www.google.com/maps/embed?pb=..."
        allowfullscreen=""
        loading="lazy"
      ></iframe>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-8">
      <div
        class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center"
      >
        <p>&copy; 2025 WeRep. All rights reserved.</p>
        <div class="flex space-x-4 mt-4 md:mt-0">
          <a href="#" class="hover:text-yellow-400"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="#" class="hover:text-yellow-400"
            ><i class="fab fa-twitter"></i
          ></a>
          <a href="#" class="hover:text-yellow-400"
            ><i class="fab fa-linkedin-in"></i
          ></a>
        </div>
      </div>
    </footer>
  </body>
</html>
